aid: grandhood
name: Grandhood
description: >-
  Grandhood is a Danish digital pension provider that lets companies set up and
  run a modern workplace (company) pension scheme entirely online, without the
  traditional adviser meetings and paperwork. Employers register with MitID,
  invite employees, and activate a plan; employees enroll, get built-in digital
  pension counselling, choose an investment profile, consolidate scattered
  pension savings, and see real-time savings, returns, and insurance coverage in
  the Grandhood mobile app. Pensions bundle both long-term savings and present-day
  insurance protection. Pricing is a simple fixed monthly amount per employee
  (65-95 DKK/month) plus investment costs, with no deposit-percentage fees and
  free pension advice. The underlying pension administration is backed by Velliv,
  Denmark's third-largest pension company. Grandhood is based in Copenhagen
  (Esplanaden 14B, 1263 København K; CVR 44147750) and is a portfolio company of
  Speedinvest. Grandhood publishes consumer web and mobile-app products; it does
  not currently expose a public developer API, SDKs, or developer documentation.
